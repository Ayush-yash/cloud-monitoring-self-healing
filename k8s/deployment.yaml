apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-monitoring-app
  namespace: monitoring-app
  labels:
    app: cloud-monitoring
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cloud-monitoring
  template:
    metadata:
      labels:
        app: cloud-monitoring
    spec:
      containers:
      - name: cloud-monitoring
        # Use the local docker image built earlier
        image: cloud-monitoring-app:1.0
        # Prevents pulling from remote registry, uses local instead
        imagePullPolicy: Never
        envFrom:
        - configMapRef:
            name: cloud-monitoring-config
        - secretRef:
            name: cloud-monitoring-secret
        ports:
        - containerPort: 8000
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          # Basic CPU/Memory requests and limits
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
