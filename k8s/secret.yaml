apiVersion: v1
kind: Secret
metadata:
  name: cloud-monitoring-secret
  namespace: monitoring-app
type: Opaque
data:
  # In Kubernetes Secrets, values must be base64 encoded.
  # To encode a value on Linux/Mac, run: echo -n "your-super-secret-key" | base64
  # For example, "django-insecure-test-key" encoded is "ZGphbmdvLWluc2VjdXJlLXRlc3Qta2V5"
  # Replace this value with your actual base64-encoded secret key in production.
  SECRET_KEY: ZGphbmdvLWluc2VjdXJlLXRlc3Qta2V5
