apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring-app
data:
  alert.rules: |-
    groups:
    - name: application-alerts
      rules:
      - alert: HighErrorRate
        expr: rate(django_http_responses_total_by_status_total{status=~"5.."}[1m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High Error Rate detected"
          description: "More than 0.1 errors/sec in the last minute on django app."

      - alert: HighCPUUsage
        expr: (sum(rate(container_cpu_usage_seconds_total{namespace="monitoring-app", pod=~"cloud-monitoring-app-.*"}[1m])) by (pod)) > 0.8
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on pod"
          description: "Pod {{ $labels.pod }} is using more than 80% CPU."

      - alert: PodDownOrCrashLoop
        expr: kube_pod_status_phase{namespace="monitoring-app", phase="Failed"} > 0 or kube_pod_container_status_restarts_total{namespace="monitoring-app"} > 3
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Pod down or crash looping"
          description: "A pod in monitoring-app is failed or restarting frequently."
